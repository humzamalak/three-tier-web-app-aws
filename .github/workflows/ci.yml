name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API lint and tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:ci-only-password@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format github .
      - run: ruff format --check .
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  images:
    name: Build and scan images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, api]
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < app/${{ matrix.service }}/Dockerfile
      # A registry can return HTTP 429 when several jobs pull at the same time.
      # Retry with a back-off.
      - name: Build
        run: |
          for attempt in 1 2 3; do
            docker build -t ${{ matrix.service }}:ci app/${{ matrix.service }} && exit 0
            echo "Build failed (attempt $attempt). Retrying in $((attempt * 20)) s."
            sleep $((attempt * 20))
          done
          exit 1
      # Trivy runs from its pinned container image, not from a third-party action.
      - name: Scan with Trivy (fail on fixable critical and high)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 \
            image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 ${{ matrix.service }}:ci

  smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - name: Create and read a task through all three tiers
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/health
          curl -fsS -X POST http://localhost:8080/api/tasks -H 'Content-Type: application/json' -d '{"title":"smoke"}'
          curl -fsS http://localhost:8080/api/tasks | grep -q smoke
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  checkov:
    name: IaC security scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov==3.4.*
      - run: checkov -d terraform --framework terraform --compact --quiet
