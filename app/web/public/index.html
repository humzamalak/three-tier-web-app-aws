<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Three-tier task list</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1>Task list</h1>
    <p class="sub">Tier 1: static site on nginx. Tier 2: FastAPI. Tier 3: PostgreSQL.</p>
    <form id="new-task">
      <label for="title" class="visually-hidden">New task</label>
      <input id="title" name="title" maxlength="200" placeholder="Add a task" required autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <ul id="tasks" aria-live="polite"></ul>
    <p id="status" class="status" role="status"></p>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
